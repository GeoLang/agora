[package]
name = "agora-server"
description = "Websocket and HTTP server for agora composition documents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
# aws_lc_rs, not rust_crypto: rust_crypto pulls rsa 0.9 (RUSTSEC-2023-0071)
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
platform-auth = { git = "https://github.com/GeoLang/platform-crates.git", branch = "master" }
platform-webhook = { git = "https://github.com/GeoLang/platform-crates.git", branch = "master" }
rand = "0.9"
# rustls-tls-webpki-roots pulls rustls/ring, the same provider sqlx's
# tls-rustls-ring already brings. A second provider in one binary leaves rustls
# with no default to pick and panics on the first connection.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# tls-rustls-ring, not the tls-rustls alias: naming ring keeps a future sqlx from
# turning on rustls's aws-lc-rs provider, which is the second provider above.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "json",
    "uuid",
    "time",
    "migrate",
] }
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
] }
